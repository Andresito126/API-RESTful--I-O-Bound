<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Subir imágenes y descargar PDF</title>
</head>

<body>
  <h1>Convertir imágenes a PDF</h1>

  <form id="uploadForm">
    <input type="file" id="images" name="images[]" accept="image/*" multiple required />
    <button type="submit">Convertir a PDF</button>
  </form>

  <div id="status"></div>
  <div id="download"></div>

  <script>
    const form = document.getElementById("uploadForm");
    const statusDiv = document.getElementById("status");
    const downloadDiv = document.getElementById("download");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const input = document.getElementById("images");
      const files = input.files;

      if (!files.length) {
        alert("Selecciona al menos una imagen");
        return;
      }

      const formData = new FormData();
      for (const file of files) {
        formData.append("images[]", file);
      }

      try {
        // 1️⃣ Crear el job
        const response = await fetch("http://localhost:3000/conversions", {
          method: "POST",
          body: formData
        });

        if (!response.ok) throw new Error("Error creando la conversión");

        const data = await response.json();
        const jobId = data.jobId;
        statusDiv.textContent = `Job creado: ${jobId}. Procesando...`;

        // 2️⃣ Polling para verificar estado
        const interval = setInterval(async () => {
          const statusResp = await fetch(`http://localhost:3000/conversions/${jobId}`);
          const job = await statusResp.json();

          statusDiv.textContent = `Estado: ${job.status}`;

          if (job.status === "done") {
            clearInterval(interval);

            // 3️⃣   Crear link de descarga
            const downloadLink = document.createElement("a");
            downloadLink.href = `http://localhost:3000/conversions/${jobId}/download`;
            downloadLink.textContent = "Descargar PDF";
            downloadDiv.appendChild(downloadLink);
          } else if (job.status === "error") {
            clearInterval(interval);
            statusDiv.textContent = `Error: ${job.errorMessage}`;
          }
        }, 2000); // cada 2 segundos
      } catch (err) {
        alert("Error: " + err.message);
      }
    });
  </script>
</body>

</html>
